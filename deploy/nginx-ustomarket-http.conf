upstream ustomarket_app {
    server 127.0.0.1:8000;
}

# HTTP — работает сразу по IP; после DNS Certbot добавит HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ustobozor.tj www.ustobozor.tj 92.119.185.123;

    client_max_body_size 25m;

    location ^~ /static/ {
        alias /home/ubuntu/Ustomarket/UstoMarketBagk/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
        error_page 403 404 = @app_cached;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        root /home/ubuntu/Ustomarket/UstoMarketBagk/web;
        try_files $uri @app_cached;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    location @app_cached {
        proxy_pass http://ustomarket_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://ustomarket_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
