upstream ustobozor_app {
    server 127.0.0.1:8000;
}

# HTTP (Certbot / redirect)
server {
    listen 80;
    server_name ustobozor.tj www.ustobozor.tj 92.119.185.123;

    location ^~ /static/ {
        alias /home/ubuntu/Ustobozor/UstoMarketBagk/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
        error_page 403 404 = @app_cached;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        root /home/ubuntu/Ustobozor/UstoMarketBagk/web;
        try_files $uri @app_cached;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    location @app_cached {
        proxy_pass http://ustobozor_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://ustobozor_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name ustobozor.tj www.ustobozor.tj 92.119.185.123;
    ssl_certificate /etc/letsencrypt/live/ustobozor.tj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ustobozor.tj/privkey.pem;

    location ^~ /static/ {
        alias /home/ubuntu/Ustobozor/UstoMarketBagk/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
        error_page 403 404 = @app_cached;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        root /home/ubuntu/Ustobozor/UstoMarketBagk/web;
        try_files $uri @app_cached;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    location @app_cached {
        proxy_pass http://ustobozor_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://ustobozor_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
