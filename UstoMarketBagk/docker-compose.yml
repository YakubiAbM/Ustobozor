services:
  app:
    build: .
    container_name: ustomarket-app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/market
      - REDIS_URL=redis://redis:6379/0
      - OTP_BACKEND=redis
    ports:
      # Только localhost — снаружи доступ через nginx :80/:443
      - "127.0.0.1:8000:8000"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./static:/app/static
      - ./web:/app/web

  redis:
    image: redis:7-alpine
    container_name: ustomarket-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    container_name: ustomarket-db
    restart: always
    environment:
      - POSTGRES_DB=market
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
