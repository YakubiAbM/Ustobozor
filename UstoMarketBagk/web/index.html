      var needPurge = false;
      try { needPurge = localStorage.getItem(LS_VER) !== WEB_VER; } catch (_) { needPurge = true; }

      function registerSw() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('/sw.js?v=' + WEB_VER).then(function (reg) {
          if (reg && reg.update) reg.update();

      if (!needPurge) {
        registerSw();
        return;
      }

      Promise.resolve()
        .then(function () {
          if ('caches' in window) {
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          }
        })
        .then(function () {
          if ('serviceWorker' in navigator) {
            return navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            });
          }
        })
        .then(function () {
          try { localStorage.setItem(LS_VER, WEB_VER); } catch (_) {}
          registerSw();
        })
        .catch(registerSw);
    })();
