# Меньше памяти для Gradle — больше остаётся для Flutter/Dart при сборке
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Один рабочий процесс Gradle — меньше конкуренции за память
org.gradle.parallel=false
org.gradle.workers.max=2